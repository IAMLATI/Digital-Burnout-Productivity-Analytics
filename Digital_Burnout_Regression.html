<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productivity Predictor</title>
<style>

body{

    font-family: Arial, sans-serif;

    background:#f4f6f8;

    text-align:center;

    margin-top:50px;

}

.container{

    background:white;

    width:400px;

    margin:auto;

    padding:30px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,0.1);

}

input{

    width:90%;

    padding:10px;

    margin:8px 0;

}

button{

    width:95%;

    padding:12px;

    background:#007bff;

    color:white;

    border:none;

    cursor:pointer;

}

button:hover{

    background:#0056b3;

}

#result{

    margin-top:20px;

    font-size:20px;

    font-weight:bold;

}
</style>
</head>
<body>
<div class="container">
<h2>Productivity Predictor</h2>
<input type="number" id="burnout_risk" placeholder="Burnout Risk">
<input type="number" id="social_media_hours" placeholder="Social Media Hours">
<input type="number" id="app_switch_frequency" placeholder="App Switch Frequency">
<input type="number" id="distraction_burden_work" placeholder="Distraction Burden Work">
<input type="number" id="deep_work_hours" placeholder="Deep Work Hours">
<input type="number" id="focus_sessions" placeholder="Focus Sessions">
<input type="number" id="concentration_score" placeholder="Concentration Score">
<input type="number" id="task_completion_rate" placeholder="Task Completion Rate">
<input type="number" id="motivation_level" placeholder="Motivation Level">
<button onclick="predict()">Predict</button>
<div id="result"></div>
</div>
<script>

function predict(){

    let payload = {

        burnout_risk:

            Number(document.getElementById("burnout_risk").value),

        social_media_hours:

            Number(document.getElementById("social_media_hours").value),

        app_switch_frequency:

            Number(document.getElementById("app_switch_frequency").value),

        distraction_burden_work:

            Number(document.getElementById("distraction_burden_work").value),

        deep_work_hours:

            Number(document.getElementById("deep_work_hours").value),

        focus_sessions:

            Number(document.getElementById("focus_sessions").value),

        concentration_score:

            Number(document.getElementById("concentration_score").value),

        task_completion_rate:

            Number(document.getElementById("task_completion_rate").value),

        motivation_level:

            Number(document.getElementById("motivation_level").value)

    };

    fetch("https://digital-burnout-productivity-analytics.onrender.com/predict", {

        method:"POST",

        headers:{

            "Content-Type":"application/json"

        },

        body:JSON.stringify(payload)

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("result").innerText =

            "Predicted Productivity: " +

            data.prediction.toFixed(2);

    })

    .catch(error => {

        document.getElementById("result").innerText =

            "Error connecting to model";

        console.log(error);

    });

}
</script>
</body>
</html>
